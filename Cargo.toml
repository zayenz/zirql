[package]
name = "zirql"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Bounded native query programs and nominal/keyed value comprehensions"
repository = "https://github.com/zayenz/zirql"
homepage = "https://zayenz.se/zirql/"
readme = "README.md"
include = [
    "/src/**",
    "/tests/**",
    "/examples/words.rs",
    "/examples/csv.rs",
    "/examples/csv/people.csv",
    "/examples/csv/teams.csv",
    "/examples/csv/indexed-arrays.zirql",
    "/docs/*.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/RELEASING.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
serde_json = "1"

[dev-dependencies]
csv = "1.4"

[[example]]
name = "csv"
test = true
